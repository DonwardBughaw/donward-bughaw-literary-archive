$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1

site:
  title: Donward Bughaw
  structure:
    - type: space
      key: space-olutanga
      title: Olutanga — Grassroots Fiction & Poetry
      path: olutanga-fiction
      default: true
      content:
        directory: ./olutanga-fiction

    - type: space
      key: space-detective
      title: Detective Fiction
      path: detective-fiction
      content:
        directory: ./detective-fiction

    - type: space
      key: space-worldbuilding
      title: Worldbuilding & Alternate History
      path: worldbuilding
      content:
        directory: ./worldbuilding

    - type: space
      key: space-about
      title: About the Author
      path: about-author
      content:
        directory: ./about-author
